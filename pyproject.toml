[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elephant-herd"
version = "0.1.0"
description = "Your notes held in memory by agents that listen and speak up when they know something"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["llm", "knowledge", "context", "agents", "notes", "claude"]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
herd = "herd.cli:main"
elephant = "herd.cli:main"

[project.urls]
Source = "https://github.com/Florin-Birgu/elephant-herd"

[tool.setuptools.packages.find]
where = ["src"]

# The skill ships inside the package: `herd claude install` copies it into
# ~/.claude/skills/, which is what makes /herd:init available.
[tool.setuptools.package-data]
herd = ["skill/SKILL.md"]
